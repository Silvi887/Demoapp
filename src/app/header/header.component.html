<header class="header">
  <div class="logo"><a routerLink="/">FIT<span>FLOW</span></a></div>
  <nav class="nav-menu"><ul>
    <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Начало</a></li>
    <li><a routerLink="/catalog" routerLinkActive="active">Каталог</a></li>
    <li><a routerLink="/nutrition" routerLinkActive="active">Хранителен режим</a></li>
    <li><a routerLink="/dashboard" routerLinkActive="active">Моите тренировки</a></li>
    @if (user(); as currentUser) {
      <li class="user-name">{{ currentUser.displayName || currentUser.email }}</li>
      <li><button type="button" class="btn-logout" (click)="logout()">Изход</button></li>
    } @else {
      <li><a routerLink="/login" routerLinkActive="active">Вход</a></li>
      <li><a routerLink="/register" routerLinkActive="active">Регистрация</a></li>
    }
  </ul></nav>
  <a routerLink="/catalog" class="btn-primary">Започни</a>
</header>
